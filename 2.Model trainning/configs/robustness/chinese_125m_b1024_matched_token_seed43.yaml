# Robustness Addition B: Chinese-Origin matched-token seed variance run.

tokenizer: tokenizers/chinese_origin_32k_eos
train_data: data/tokenized/chinese_train_full_eos_1024
valid_data: data/tokenized/chinese_valid_full_eos_1024
output_dir: outputs/chinese_125m_b1024_matched_token_seed43

expected_vocab_size: 32001
expected_eos_id: 32000
expected_pad_id: 32000

hidden_size: 768
intermediate_size: 2048
num_hidden_layers: 12
num_attention_heads: 12
max_position_embeddings: 1024
rms_norm_eps: 1.0e-5
hidden_act: silu
rope_theta: 10000.0
tie_word_embeddings: false

max_steps: 27176
per_device_train_batch_size: 16
per_device_eval_batch_size: 16
gradient_accumulation_steps: 4
learning_rate: 3.0e-4
weight_decay: 0.1
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-8
scheduler: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0
eval_steps: 1000
save_steps: 1000
logging_steps: 20
save_total_limit: 3
dataloader_drop_last: true
seed: 43
